events {
    worker_connections 1024;
}

http {
    # 優化傳輸設定
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 1024M; # 允許上傳大圖或模型

    # WebSocket 支援變數設定
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # =================================================
    # 第一台 (8188)
    # Cloudflare 網址: gpu1.trytryalberthong.dpdns.org
    # =================================================
    server {
        listen 5000;
        server_name gpu1.trytryalberthong.dpdns.org; 

        location / {
            proxy_pass http://ubuntu2204-large:8188;
            
            # WebSocket 必要設定
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            # 傳遞真實 IP 與 Host
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # ComfyUI 生成可能很久，避免 Cloudflare/nginx 提早斷線
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # 視情況：上傳大檔/避免緩衝造成卡住
            proxy_request_buffering off;
            proxy_buffering off;
        }
    }

    # =================================================
    # 第二台 (8189)
    # Cloudflare 網址: gpu2.trytryalberthong.dpdns.org
    # =================================================
    server {
        listen 5000;
        server_name gpu2.trytryalberthong.dpdns.org;

        location / {
            # 這裡導向到 8189
            proxy_pass http://ubuntu2204-large:8189;

            # WebSocket 必要設定 (複製上面的即可)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # ComfyUI 生成可能很久，避免 Cloudflare/nginx 提早斷線
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # 視情況：上傳大檔/避免緩衝造成卡住
            proxy_request_buffering off;
            proxy_buffering off;
        }
    }
    
    # (可選) 預設處理：如果有未定義的網域連進來，回傳 404
    server {
        listen 5000 default_server;
        server_name _;
        return 404;
    }
}